<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 870" width="1300" height="870" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!--
    HireAssist — Architecture Diagram, version 1 (Microservice Design with Collaborations)
    Hand-authored SVG in the style of the FTGO example used in the course. Edit this file directly.
    Arrow convention (set by the course): A -> B means "A calls B". Responses are not drawn.
    Version 1 draws every call as REST, as the course asks for a first version. The protocols the
    ADRs decided (gRPC to the AI Service, RabbitMQ for screening) are drawn in a later version.
    Operations are listed in docs/SERVICE-OPERATIONS-COLLABORATORS.md, not on the arrows.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <g id="person">
      <circle cx="0" cy="-30" r="8" fill="#222"/>
      <line x1="0" y1="-22" x2="0" y2="6" stroke="#222" stroke-width="4"/>
      <line x1="-14" y1="-12" x2="14" y2="-12" stroke="#222" stroke-width="4"/>
      <line x1="0" y1="6" x2="-11" y2="28" stroke="#222" stroke-width="4"/>
      <line x1="0" y1="6" x2="11" y2="28" stroke="#222" stroke-width="4"/>
    </g>
    <g id="browser">
      <circle cx="0" cy="0" r="27" fill="#F9D5E5" stroke="#333"/>
      <rect x="-14" y="-10" width="28" height="19" rx="2" fill="#FFF" stroke="#333"/>
      <line x1="-14" y1="-4" x2="14" y2="-4" stroke="#333"/>
      <line x1="-7" y1="14" x2="7" y2="14" stroke="#333" stroke-width="2"/>
    </g>
    <g id="clock">
      <circle cx="0" cy="0" r="27" fill="#F9D5E5" stroke="#333"/>
      <circle cx="0" cy="0" r="14" fill="#FFF" stroke="#333"/>
      <line x1="0" y1="0" x2="0" y2="-9" stroke="#333" stroke-width="2"/>
      <line x1="0" y1="0" x2="7" y2="4" stroke="#333" stroke-width="2"/>
    </g>
    <g id="db">
      <path d="M -20 0 v 30 a 20 6 0 0 0 40 0 v -30" fill="#D9C2E6" stroke="#333"/>
      <ellipse cx="0" cy="0" rx="20" ry="6" fill="#E9DAF2" stroke="#333"/>
      <ellipse cx="0" cy="10" rx="20" ry="6" fill="none" stroke="#333"/>
      <ellipse cx="0" cy="20" rx="20" ry="6" fill="none" stroke="#333"/>
    </g>
  </defs>

  <style>
    .hex { fill: #CFE8F3; stroke: #333; stroke-width: 1.2; }
    .hexEdge { fill: #D7EAE4; stroke: #333; stroke-width: 1.2; }
    .tab { fill: #C8E6A6; stroke: #333; }
    .adapter { fill: #CFE6E0; stroke: #333; }
    .ext { fill: #E6F2E6; stroke: #333; stroke-width: 1.2; }
    .call { fill: none; stroke: #333; stroke-width: 1.4; marker-end: url(#arrow); }
    .name { font-size: 14px; text-anchor: middle; }
    .small { font-size: 11px; text-anchor: middle; fill: #333; }
    .lbl { font-size: 13px; text-anchor: middle; }
  </style>

  <text x="40" y="36" font-size="16" font-weight="bold">HireAssist — Architecture Diagram (version 1)</text>

  <!-- ── Actors ────────────────────────────────────────────────────────────── -->
  <use href="#person" x="60" y="250"/>
  <text x="60" y="298" class="lbl">Recruiter</text>
  <use href="#browser" x="140" y="250"/>

  <use href="#person" x="60" y="360"/>
  <text x="60" y="408" class="lbl">Admin</text>
  <use href="#browser" x="140" y="360"/>

  <use href="#person" x="60" y="600"/>
  <text x="60" y="648" class="lbl">System Scheduler</text>
  <use href="#clock" x="140" y="600"/>

  <!-- ── Web UI and API Gateway ────────────────────────────────────────────── -->
  <polygon class="hexEdge" points="195,305 232,255 308,255 345,305 308,355 232,355"/>
  <text x="270" y="301" class="name">HireAssist</text>
  <text x="270" y="318" class="name">Web UI</text>

  <polygon class="hexEdge" points="385,305 422,255 498,255 535,305 498,355 422,355"/>
  <rect x="372" y="247" width="56" height="40" class="tab"/>
  <text x="400" y="263" class="small">REST</text>
  <text x="400" y="277" class="small">API</text>
  <text x="462" y="301" class="name">API</text>
  <text x="462" y="318" class="name">Gateway</text>

  <!-- ── Services. Hexagon: cx=760, w=210, h=100 ───────────────────────────── -->
  <!-- AI Service, cy=150 -->
  <polygon class="hex" points="655,150 707,100 813,100 865,150 813,200 707,200"/>
  <rect x="615" y="100" width="60" height="40" class="tab"/>
  <text x="645" y="116" class="small">REST</text>
  <text x="645" y="130" class="small">API</text>
  <text x="760" y="147" class="name">AI</text>
  <text x="760" y="164" class="name">Service</text>
  <rect x="872" y="105" width="92" height="42" class="adapter"/>
  <text x="918" y="123" class="small">LLM</text>
  <text x="918" y="137" class="small">Adapter</text>

  <!-- Hiring Service, cy=300 -->
  <polygon class="hex" points="655,300 707,250 813,250 865,300 813,350 707,350"/>
  <rect x="615" y="250" width="60" height="40" class="tab"/>
  <text x="645" y="266" class="small">REST</text>
  <text x="645" y="280" class="small">API</text>
  <text x="750" y="297" class="name">Hiring</text>
  <text x="750" y="314" class="name">Service</text>
  <use href="#db" x="830" y="318"/>
  <rect x="872" y="252" width="92" height="42" class="adapter"/>
  <text x="918" y="270" class="small">Object Storage</text>
  <text x="918" y="284" class="small">Adapter</text>
  <rect x="872" y="304" width="92" height="42" class="adapter"/>
  <text x="918" y="322" class="small">Email</text>
  <text x="918" y="336" class="small">Adapter</text>

  <!-- Resume Processing Service, cy=450 -->
  <polygon class="hex" points="655,450 707,400 813,400 865,450 813,500 707,500"/>
  <rect x="615" y="400" width="60" height="40" class="tab"/>
  <text x="645" y="416" class="small">REST</text>
  <text x="645" y="430" class="small">API</text>
  <text x="750" y="440" class="name">Resume</text>
  <text x="750" y="457" class="name">Processing</text>
  <text x="750" y="474" class="name">Service</text>
  <use href="#db" x="830" y="468"/>
  <rect x="872" y="429" width="92" height="42" class="adapter"/>
  <text x="918" y="447" class="small">Object Storage</text>
  <text x="918" y="461" class="small">Adapter</text>

  <!-- Compliance & Insights Service, cy=600 -->
  <polygon class="hex" points="655,600 707,550 813,550 865,600 813,650 707,650"/>
  <rect x="615" y="550" width="60" height="40" class="tab"/>
  <text x="645" y="566" class="small">REST</text>
  <text x="645" y="580" class="small">API</text>
  <text x="750" y="590" class="name">Compliance &amp;</text>
  <text x="750" y="607" class="name">Insights</text>
  <text x="750" y="624" class="name">Service</text>
  <use href="#db" x="830" y="618"/>
  <rect x="872" y="579" width="92" height="42" class="adapter"/>
  <text x="918" y="597" class="small">Email</text>
  <text x="918" y="611" class="small">Adapter</text>

  <!-- Identity Service, cy=750 -->
  <polygon class="hex" points="655,750 707,700 813,700 865,750 813,800 707,800"/>
  <rect x="615" y="700" width="60" height="40" class="tab"/>
  <text x="645" y="716" class="small">REST</text>
  <text x="645" y="730" class="small">API</text>
  <text x="750" y="747" class="name">Identity</text>
  <text x="750" y="764" class="name">Service</text>
  <use href="#db" x="830" y="768"/>

  <!-- ── External systems ──────────────────────────────────────────────────── -->
  <rect x="1050" y="90" width="230" height="600" rx="6" fill="none" stroke="#666" stroke-dasharray="7,5"/>
  <text x="1165" y="112" class="small" font-weight="bold">External systems</text>

  <rect x="1070" y="125" width="190" height="60" rx="26" class="ext"/>
  <text x="1165" y="151" class="name">LLM Provider</text>
  <text x="1165" y="167" class="small">Anthropic Claude API</text>

  <rect x="1070" y="360" width="190" height="60" rx="26" class="ext"/>
  <text x="1165" y="386" class="name">Object Storage</text>
  <text x="1165" y="402" class="small">S3-compatible (MinIO)</text>

  <rect x="1070" y="590" width="190" height="60" rx="26" class="ext"/>
  <text x="1165" y="616" class="name">Email Provider</text>
  <text x="1165" y="632" class="small">SMTP / SES</text>

  <!-- ── Calls (A → B means A calls B) ─────────────────────────────────────── -->
  <line class="call" x1="169" y1="250" x2="234" y2="282"/>
  <line class="call" x1="169" y1="360" x2="234" y2="328"/>
  <line class="call" x1="347" y1="305" x2="383" y2="305"/>

  <line class="call" x1="537" y1="303" x2="613" y2="272"/>
  <line class="call" x1="537" y1="307" x2="613" y2="572"/>
  <line class="call" x1="535" y1="311" x2="613" y2="722"/>

  <line class="call" x1="169" y1="600" x2="653" y2="600"/>

  <line class="call" x1="760" y1="248" x2="760" y2="202"/>
  <line class="call" x1="740" y1="352" x2="740" y2="398"/>
  <line class="call" x1="780" y1="398" x2="780" y2="352"/>
  <polyline class="call" points="813,400 985,400 985,175 840,175"/>
  <line class="call" x1="780" y1="548" x2="780" y2="502"/>
  <polyline class="call" points="707,550 585,550 585,330 683,330"/>
  <line class="call" x1="760" y1="652" x2="760" y2="698"/>

  <line class="call" x1="965" y1="126" x2="1068" y2="150"/>
  <line class="call" x1="965" y1="273" x2="1068" y2="385"/>
  <line class="call" x1="965" y1="325" x2="1068" y2="612"/>
  <line class="call" x1="965" y1="450" x2="1068" y2="395"/>
  <line class="call" x1="965" y1="600" x2="1068" y2="622"/>

  <text x="40" y="845" font-size="11" fill="#444">A → B means A calls B (responses are not drawn) · every call is REST in this version · one deployment per customer company (ADR-006).</text>
</svg>
