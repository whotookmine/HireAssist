# The API Gateway: the one entry point for user traffic, and with the web app the only Service
# published outside the cluster (ADR-010) — a NodePort, which kind maps to localhost:30800.
#
# It finds the services behind it by name (ADR-014): HIRING_URL and IDENTITY_URL hold Service
# names, never addresses, so a Pod replaced or rescheduled behind them changes nothing here.
#
# The image is the Compose stack's (deploy/dev-keys/gateway.Dockerfile), started without its key
# wrapper: the public verification key comes from the gateway-verification-key Secret, and the
# gateway never holds the private half (ADR-009).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: hireassist
  labels: { app: gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway, tier: service }
    spec:
      containers:
        - name: gateway
          image: hireassist/gateway:dev
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/gateway"]
          ports:
            - containerPort: 8000
          env:
            - { name: PORT, value: "8000" }
            - { name: IDENTITY_URL, value: "http://identity.hireassist.svc:8081" }
            - { name: HIRING_URL, value: "http://hiring.hireassist.svc:8080" }
            # The web app's refresh cookie is Secure by default; this cluster serves plain HTTP.
            - { name: SESSION_COOKIE_SECURE, value: "false" }
            - name: JWT_PUBLIC_KEYS
              valueFrom: { secretKeyRef: { name: gateway-verification-key, key: JWT_PUBLIC_KEYS } }
          # Ready only once it holds a verification key; without one it would reject every
          # protected route.
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: hireassist
spec:
  type: NodePort
  selector: { app: gateway }
  ports:
    - name: http
      port: 8000
      nodePort: 30800
