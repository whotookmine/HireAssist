# The web app: nginx serving the single-page app and forwarding /api to the gateway. Published as
# a NodePort, which kind maps to http://localhost:30080.
#
# Its nginx.conf says `proxy_pass http://gateway:8000/` — a short name, which resolves here
# through the Pod's DNS search path to gateway.hireassist.svc (ADR-014). That is why the image
# built for the Compose stack runs here unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hireassist
  labels: { app: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, tier: service }
    spec:
      containers:
        - name: web
          image: hireassist/web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: hireassist
spec:
  type: NodePort
  selector: { app: web }
  ports:
    - name: http
      port: 80
      nodePort: 30080
